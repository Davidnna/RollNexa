name: RollNexa Staging QR Concurrency Test

on:
    workflow_dispatch:
        inputs:
            session_id:
                description: "Active attendance session ID in the isolated staging database."
                required: true
                type: string
            mode:
                description: "Use one student for a duplicate-scan race or eight students for a distinct-student race."
                required: true
                type: choice
                options:
                    - same-student
                    - distinct
            confirmation:
                description: "Type RUN_STAGING_CONCURRENCY to confirm this test targets staging only."
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: rollnexa-staging-qr-concurrency
    cancel-in-progress: false

jobs:
    qr-concurrency:
        name: Run eight concurrent QR check-ins against staging
        if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_STAGING_CONCURRENCY'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: rollnexa-staging
        env:
            BASE_URL: ${{ secrets.STAGING_BASE_URL }}
            LECTURER_USERNAME: ${{ secrets.STAGING_LECTURER_USERNAME }}
            LECTURER_PASSWORD: ${{ secrets.STAGING_LECTURER_PASSWORD }}
            STUDENTS_JSON: ${{ secrets.STAGING_STUDENTS_JSON }}
            SESSION_ID: ${{ inputs.session_id }}
            MODE: ${{ inputs.mode }}
            CONCURRENCY: "8"
        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Validate staging target and test configuration
              shell: bash
              run: |
                  set -euo pipefail
                  for name in BASE_URL LECTURER_USERNAME LECTURER_PASSWORD STUDENTS_JSON SESSION_ID MODE; do
                      if [[ -z "${!name:-}" ]]; then
                          echo "Required staging environment secret or input is missing: $name" >&2
                          exit 1
                      fi
                  done
                  [[ "$SESSION_ID" =~ ^[0-9]+$ ]] || {
                      echo "The staging attendance session ID must be numeric." >&2
                      exit 1
                  }
                  python - <<'PY'
                  import os
                  from urllib.parse import urlparse

                  parsed = urlparse(os.environ["BASE_URL"])
                  if parsed.scheme != "https" or not parsed.hostname:
                      raise SystemExit("STAGING_BASE_URL must be a valid HTTPS URL.")
                  host = parsed.hostname.lower()
                  if host == "rollnexa.onrender.com" or "staging" not in host:
                      raise SystemExit(
                          "Refusing to run load tests unless the hostname explicitly identifies an isolated staging service."
                      )
                  if parsed.path not in ("", "/") or parsed.query or parsed.fragment:
                      raise SystemExit("STAGING_BASE_URL must contain only the staging origin.")

                  import json
                  students = json.loads(os.environ["STUDENTS_JSON"])
                  expected = 1 if os.environ["MODE"] == "same-student" else 8
                  if not isinstance(students, list) or len(students) != expected:
                      raise SystemExit(
                          f"{os.environ['MODE']} mode requires exactly {expected} staging test student account(s)."
                      )
                  if any(not isinstance(item, dict) or not item.get("username") or not item.get("password") for item in students):
                      raise SystemExit("Every staging student entry must contain a username and password.")
                  if len({item["username"] for item in students}) != len(students):
                      raise SystemExit("Distinct staging test student usernames must be unique.")
                  PY

            - name: Authenticate the staging lecturer and issue a fresh QR token
              shell: bash
              run: |
                  set -euo pipefail
                  cookie_jar="$RUNNER_TEMP/rollnexa-staging-cookies.txt"
                  csrf_response="$RUNNER_TEMP/rollnexa-staging-csrf.json"
                  login_response="$RUNNER_TEMP/rollnexa-staging-login.json"
                  qr_response="$RUNNER_TEMP/rollnexa-staging-qr.json"
                  login_payload="$RUNNER_TEMP/rollnexa-staging-login-payload.json"
                  trap 'rm -f "$cookie_jar" "$csrf_response" "$login_response" "$qr_response" "$login_payload"' EXIT

                  curl --fail --silent --show-error --retry 2 --connect-timeout 15 --max-time 30 \
                      --cookie-jar "$cookie_jar" --output "$csrf_response" \
                      "$BASE_URL/api/v1/csrf/"
                  csrf_token=$(python - "$csrf_response" <<'PY'
                  import json
                  import sys

                  with open(sys.argv[1], encoding="utf-8") as source:
                      value = json.load(source).get("csrfToken")
                  if not isinstance(value, str) or not value:
                      raise SystemExit("Staging CSRF endpoint did not return a token.")
                  print(value)
                  PY
                  )

                  python - "$login_payload" <<'PY'
                  import json
                  import os
                  import sys

                  with open(sys.argv[1], "w", encoding="utf-8") as target:
                      json.dump(
                          {"username": os.environ["LECTURER_USERNAME"], "password": os.environ["LECTURER_PASSWORD"]},
                          target,
                      )
                  PY
                  chmod 600 "$login_payload"

                  curl --fail --silent --show-error --retry 2 --connect-timeout 15 --max-time 30 \
                      --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
                      --header 'Content-Type: application/json' \
                      --header "X-CSRFToken: $csrf_token" \
                      --data-binary "@$login_payload" \
                      --output "$login_response" \
                      "$BASE_URL/api/v1/auth/login/"
                  python - "$login_response" <<'PY'
                  import json
                  import sys

                  with open(sys.argv[1], encoding="utf-8") as source:
                      payload = json.load(source)
                  if payload.get("authenticated") is not True or payload.get("user", {}).get("role") != "lecturer":
                      raise SystemExit("The staging account did not authenticate as a lecturer.")
                  PY

                  curl --fail --silent --show-error --retry 2 --connect-timeout 15 --max-time 30 \
                      --cookie "$cookie_jar" --output "$qr_response" \
                      "$BASE_URL/api/v1/attendance/sessions/$SESSION_ID/qr/"
                  qr_token=$(python - "$qr_response" <<'PY'
                  import json
                  import sys

                  with open(sys.argv[1], encoding="utf-8") as source:
                      payload = json.load(source)
                  value = payload.get("token")
                  ttl = payload.get("ttlSeconds", 0)
                  if not isinstance(value, str) or not value:
                      raise SystemExit("The staging attendance session did not return a QR token.")
                  if not isinstance(ttl, int) or ttl < 45:
                      raise SystemExit("The QR token has insufficient remaining validity. Re-issue it from a fresh active staging session.")
                  print(value)
                  PY
                  )
                  echo "::add-mask::$qr_token"
                  echo "QR_TOKEN=$qr_token" >> "$GITHUB_ENV"

            - name: Run bounded eight-user QR concurrency test
              run: |
                  set -euo pipefail
                  docker run --rm \
                      --env BASE_URL \
                      --env QR_TOKEN \
                      --env STUDENTS_JSON \
                      --env MODE \
                      --env CONCURRENCY \
                      --volume "$GITHUB_WORKSPACE:/workspace:ro" \
                      --workdir /workspace \
                      grafana/k6:0.55.0 run scripts/k6_qr_checkin.js
