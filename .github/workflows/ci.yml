name: RollNexa CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: rollnexa-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend-tests:
        name: Django checks and PostgreSQL tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: rollnexa
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d rollnexa"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        defaults:
            run:
                working-directory: backend
        env:
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rollnexa
            DATABASE_SSL_REQUIRE: "false"
            DEBUG: "false"
            SECRET_KEY: rollnexa-ci-only-secret-key-not-used-outside-tests-2026
            ALLOWED_HOSTS: localhost,127.0.0.1,testserver
            SECURE_SSL_REDIRECT: "false"
            BIOMETRIC_ENCRYPTION_KEY_VERSION: ci-test-v1
            BIOMETRIC_CONSENT_POLICY_VERSION: "1.1"
        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Install backend dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt

            - name: Create an ephemeral test encryption key
              run: |
                  python - <<'PY' >> "$GITHUB_ENV"
                  from cryptography.fernet import Fernet
                  print(f"BIOMETRIC_ENCRYPTION_KEY={Fernet.generate_key().decode('ascii')}")
                  PY

            - name: Check Django production security configuration
              env:
                  SECURE_SSL_REDIRECT: "true"
                  SECURE_HSTS_SECONDS: "31536000"
                  SESSION_COOKIE_SECURE: "true"
                  CSRF_COOKIE_SECURE: "true"
              run: python manage.py check --deploy

            - name: Check migration files
              run: python manage.py makemigrations --check --dry-run

            - name: Apply migrations to the ephemeral PostgreSQL service
              run: python manage.py migrate --noinput

            - name: Verify migration state
              run: python manage.py migrate --check

            - name: Collect static assets for manifest-backed template tests
              run: python manage.py collectstatic --noinput

            - name: Run the complete Django test suite
              run: python manage.py test --verbosity=2

    frontend-build:
        name: React and TypeScript production build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Resolve and create frontend lockfile
              run: npm install --package-lock-only --no-audit --no-fund

            - name: Upload generated lockfile for repository adoption
              uses: actions/upload-artifact@v6
              with:
                  name: rollnexa-frontend-package-lock
                  path: frontend/package-lock.json
                  if-no-files-found: error
                  retention-days: 7

            - name: Install exact resolved frontend dependencies
              run: npm ci --no-audit --no-fund

            - name: Build React application
              run: npm run build

    docker-build:
        name: Production Docker image build
        runs-on: ubuntu-latest
        timeout-minutes: 35
        needs:
            - backend-tests
            - frontend-build
        steps:
            - name: Check out source
              uses: actions/checkout@v7

            - name: Set up Node.js for lockfile generation
              uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Generate lockfile in Docker build context
              working-directory: frontend
              run: npm install --package-lock-only --no-audit --no-fund

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build production image without publishing
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  tags: rollnexa:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
