services:
    -
        type: web
        name: rollnexa
        runtime: docker
        plan: free
        region: frankfurt
        dockerfilePath: ./Dockerfile
        dockerContext: .
        autoDeployTrigger: commit
        healthCheckPath: /readyz
        envVars:
            -
                key: DATABASE_URL
                sync: false
            -
                key: DIRECT_DATABASE_URL
                sync: false
            -
                key: SECRET_KEY
                generateValue: true
            -
                key: DEBUG
                value: "false"
            -
                key: WEB_CONCURRENCY
                value: "1"
            -
                key: SECURE_SSL_REDIRECT
                value: "true"
            -
                key: SECURE_HSTS_SECONDS
                value: "31536000"
            -
                key: SECURE_HSTS_INCLUDE_SUBDOMAINS
                value: "false"
            -
                key: SECURE_HSTS_PRELOAD
                value: "false"
            -
                key: BIOMETRIC_ENCRYPTION_KEY
                generateValue: true
            -
                key: BIOMETRIC_ENCRYPTION_KEY_VERSION
                value: v1
            -
                key: BIOMETRIC_CONSENT_POLICY_VERSION
                value: "1.1"
            -
                key: BIOMETRIC_FACE_MATCH_THRESHOLD
                value: "0.363"
            -
                key: BIOMETRIC_FACE_DETECTION_THRESHOLD
                value: "0.75"
