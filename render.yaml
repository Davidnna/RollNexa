services:
    -
        type: web
        name: rollnexa
        runtime: docker
        plan: free
        region: frankfurt
        dockerfilePath: ./Dockerfile
        dockerContext: .
        autoDeployTrigger: commit
        healthCheckPath: /healthz
        envVars:
            -
                key: DATABASE_URL
                sync: false
            -
                key: DIRECT_DATABASE_URL
                sync: false
            -
                key: SECRET_KEY
                generateValue: true
            -
                key: DEBUG
                value: "false"
            -
                key: WEB_CONCURRENCY
                value: "1"
