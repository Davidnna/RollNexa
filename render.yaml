services:
    -
        type: web
        name: rollnexa
        runtime: docker
        plan: free
        region: frankfurt
        dockerfilePath: ./Dockerfile
        dockerContext: .
        autoDeployTrigger: commit
        healthCheckPath: /healthz
        envVars:
            -
                key: DATABASE_URL
                sync: false
            -
                key: DIRECT_DATABASE_URL
                sync: false
            -
                key: SECRET_KEY
                generateValue: true
            -
                key: DEBUG
                value: "false"
            -
                key: WEB_CONCURRENCY
                value: "1"
            -
                key: BIOMETRIC_ENCRYPTION_KEY
                generateValue: true
            -
                key: BIOMETRIC_ENCRYPTION_KEY_VERSION
                value: v1
            -
                key: BIOMETRIC_CONSENT_POLICY_VERSION
                value: "1.0"
            -
                key: BIOMETRIC_FACE_MATCH_THRESHOLD
                value: "0.363"
